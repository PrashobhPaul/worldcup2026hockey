name: Build Android APK

# Wraps the deployed PWA in a Trusted Web Activity via Bubblewrap and
# publishes the APK to a rolling GitHub Release, so Android users can
# sideload the app directly.
#
# Signing: if the ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets
# are set, the APK is signed with that stable key (installs update in
# place, and the fingerprint can be published in assetlinks.json for the
# full-screen TWA experience). Without them a fresh key is generated per
# build — the APK still installs, but each new build must be uninstalled
# first, and Android shows the browser bar until asset links verify.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['twa-manifest.json', '.github/workflows/build-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # An APK is a thing people install and keep, so it must not be built
      # against a host that does not exist yet. twa-manifest.json names the
      # host the app will open; if that name does not resolve and serve, every
      # install is a blank screen nobody can fix from their phone. Stop here
      # instead — the same ahead-of-DNS mistake that took the web app down.
      - name: The app's host has to be live before anything is built
        run: |
          HOST=$(node -p "require('./twa-manifest.json').host")
          URL="https://$HOST/"
          # curl's own failure and the HTTP status have to be read separately.
          # -w always prints a code, so `|| echo 000` on an unresolvable host
          # appends a second one and the comparison silently stops matching —
          # the guard would wave through exactly the outage it exists to catch.
          if ! CODE=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$URL"); then
            echo "::error::$URL could not be reached at all. Create the DNS record and let Pages serve it before building an APK — otherwise the build installs an app that opens nothing."
            exit 1
          fi
          case "$CODE" in
            2*|3*) echo "::notice::$URL answered HTTP $CODE — safe to build." ;;
            *)
              echo "::error::$URL answered HTTP $CODE, so the app would open an error page. Fix the site before building an APK."
              exit 1 ;;
          esac

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android.keystore
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "KS_STABLE=1" >> "$GITHUB_ENV"
            echo "Stable keystore from secrets."
          else
            KS_PASS="hockeyai-$(openssl rand -hex 8)"
            keytool -genkeypair -v -keystore android.keystore -alias hockeyai \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Hockey.AI, OU=App, O=Hockey.AI, L=NA, S=NA, C=IN"
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "Ephemeral keystore generated (set ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets for stable signing)."
          fi

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap paths
        run: |
          # Bubblewrap validates androidSdkPath by looking for tools/ or bin/
          # at its root (its own managed-download layout), while the runner's
          # SDK uses the modern cmdline-tools/latest layout. A shim directory
          # of symlinks satisfies both: bin/ from cmdline-tools, everything
          # else from the real SDK.
          SDK_SHIM="$HOME/bubblewrap-sdk"
          mkdir -p "$SDK_SHIM"
          ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$SDK_SHIM/bin"
          for d in build-tools platforms platform-tools licenses cmdline-tools tools; do
            [ -e "$ANDROID_HOME/$d" ] && ln -s "$ANDROID_HOME/$d" "$SDK_SHIM/$d" || true
          done
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {"jdkPath": "$JAVA_HOME", "androidSdkPath": "$SDK_SHIM"}
          EOF
          ls -la "$SDK_SHIM"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KS_PASS }}
        run: |
          # Gradle's Android plugin refuses when ANDROID_HOME and
          # ANDROID_SDK_ROOT disagree; point both at the shim.
          export ANDROID_HOME="$HOME/bubblewrap-sdk"
          export ANDROID_SDK_ROOT="$HOME/bubblewrap-sdk"
          bubblewrap doctor || true
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation
          ls -la ./*.apk || ls -la app/build/outputs/apk/release/ || true
          APK=$(find . -name 'app-release-signed.apk' -o -name 'app-release.apk' | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          cp "$APK" HockeyAI.apk

      # Digital Asset Links is the whole difference between a full-screen app
      # and one wearing a browser address bar. Android reads the statement
      # from the DOMAIN ROOT — https://<host>/.well-known/assetlinks.json —
      # and never from a sub-path. On the old project-pages URL this file
      # deployed under /worldcup2026hockey/, where Android never looked, so
      # every build so far installed with the bar showing. It only works now
      # because public/CNAME serves the site at the root of its own domain.
      - name: Publish asset links (stable signing only)
        if: ${{ env.KS_STABLE == '1' }}
        run: |
          FP=$(keytool -exportcert -keystore android.keystore -alias hockeyai \
                -storepass "$KS_PASS" -rfc | openssl x509 -noout -fingerprint -sha256 \
                | sed 's/.*=//')
          mkdir -p public/.well-known
          cat > public/.well-known/assetlinks.json <<EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.prashobhpaul.hockeyai",
              "sha256_cert_fingerprints": ["$FP"]
            }
          }]
          EOF
          if ! git diff --quiet -- public/.well-known/assetlinks.json; then
            git config user.name "hockey-ai-bot"
            git config user.email "actions@github.com"
            git add public/.well-known/assetlinks.json
            git commit -m "android: publish asset links for the app signing key"
            git push origin HEAD:main
          fi

      # Say plainly what this APK will do once installed, rather than leaving
      # a browser-headed build to be discovered on a phone. The host comes
      # from twa-manifest.json, so this cannot drift from what was built.
      - name: Report the asset-link state
        run: |
          HOST=$(node -p "require('./twa-manifest.json').host")
          URL="https://$HOST/.well-known/assetlinks.json"
          if [ "${KS_STABLE:-0}" != "1" ]; then
            echo "::warning::Signed with an EPHEMERAL key, so no asset links were published. This APK will show the browser address bar and cannot update an installed copy in place. Set ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD for a full-screen, updatable build."
            exit 0
          fi
          CODE=$(curl -s -o /tmp/al.json -w '%{http_code}' "$URL" || echo 000)
          if [ "$CODE" = "200" ] && grep -q "com.prashobhpaul.hockeyai" /tmp/al.json; then
            echo "::notice::Asset links live at $URL — the installed app runs full-screen."
          else
            echo "::warning::$URL is not serving the statement yet (HTTP $CODE). Expected on the run that first publishes it, since the Pages deploy follows this job. Re-check after that deploy; reinstall the APK if the address bar is still showing."
          fi

      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes 2>/dev/null || true
          git push --delete origin apk-latest 2>/dev/null || true
          gh release create apk-latest HockeyAI.apk \
            --title "Hockey.AI for Android" \
            --notes "Sideloadable Android build of the Hockey.AI PWA (Trusted Web Activity). Download HockeyAI.apk, allow installs from your browser when prompted, and open. Same app, same offline storage, same live data — with the match-alert bell available from the Home screen once a team is followed."

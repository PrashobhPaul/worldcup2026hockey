name: Build Android APK

# Hockey.AI for Android — a real app, not a browser pointed at the website.
#
# This used to wrap the deployed site in a Trusted Web Activity, which is
# literally a Chrome window: it showed the address bar unless Android could
# verify the app against the site, it could only ever be as available as that
# site, and it tied the app's fate to a domain resolving. None of that has
# anything to do with what the app is for.
#
# Now the interface is compiled into the APK and the app reads the same
# central data files the web app reads. Two clients, one source. The app opens
# with the data it shipped with, refreshes from the repository whenever there
# is a connection, and keeps working when there is not — no site, no domain
# and no asset-link verification anywhere in the picture.
#
# Signing: with ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD set, the APK
# is signed with that stable key and installs as an update over a previous
# copy. Without them a fresh key is generated per build — still installable,
# but Android will not update an existing install in place.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # The interface that ships inside the APK. VITE_NATIVE drops the site's
      # base path (the app serves from its own root) and the service worker
      # (every asset is already local). VITE_DATA_BASE is the one thing the app
      # needs from outside: the central data files, read straight from this
      # repository, so the app does not care whether the website is up.
      - name: Build the interface for the app
        env:
          VITE_NATIVE: '1'
          VITE_DATA_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main/public/data
        run: |
          npm run build
          test -f dist/index.html
          # A bundled shell still pointing at a site's sub-path would load
          # nothing once installed, so prove the paths are app-root-relative.
          if grep -q 'src="/worldcup2026hockey/' dist/index.html; then
            echo "::error::The app build carries the website's base path — it would load nothing once installed."
            exit 1
          fi
          # And the app must not be left reading its own bundled snapshot.
          grep -q 'raw.githubusercontent.com' dist/assets/*.js \
            || { echo "::error::the app build has no central data URL compiled in"; exit 1; }

          # Compiled in is not the same as answering. An APK is installed and
          # kept, so one built against a data URL that does not serve is a blank
          # app nobody can fix from their phone — the same ahead-of-reality
          # mistake that took the website down. Read curl's own failure and the
          # HTTP status separately: -w always prints a code, so `|| echo 000`
          # on an unreachable host appends a second one and the comparison
          # silently stops matching, waving through the outage it exists to catch.
          if ! CODE=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$VITE_DATA_BASE/data-version.json"); then
            echo "::error::$VITE_DATA_BASE/data-version.json could not be reached at all. The app would open on its shipped snapshot and never update."
            exit 1
          fi
          case "$CODE" in
            2*) echo "::notice::central data answered HTTP $CODE — safe to build." ;;
            *)
              echo "::error::$VITE_DATA_BASE/data-version.json answered HTTP $CODE, so the app could never refresh. Fix the data path before building an APK."
              exit 1 ;;
          esac

      - name: Prepare keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android.keystore
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "Stable keystore from secrets."
          else
            KS_PASS="hockeyai-$(openssl rand -hex 8)"
            keytool -genkeypair -v -keystore android.keystore -alias hockeyai \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Hockey.AI, OU=App, O=Hockey.AI, L=NA, S=NA, C=IN"
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_B64 secret, so this APK is signed with a throwaway key. It installs, but Android will refuse to update an existing install over it — set the secrets for a stable signature."
          fi

      # The Android project is generated rather than committed: it is entirely
      # derived from capacitor.config.json and the build above, and a checked-in
      # copy only rots against the toolchain.
      - name: Generate the Android project
        run: |
          npm i --no-save @capacitor/cli @capacitor/android
          npx cap add android

          # The generated project ships Capacitor's own launcher icon, so the
          # installed app wore a stranger's logo. These are the Hockey.AI badge
          # at every density, generated from the source artwork by
          # scripts/make_icons.py, plus the adaptive pair for Android 8+.
          cp -r resources/android/res/* android/app/src/main/res/

          npx cap sync android

          # Prove both of those took, rather than finding out from a phone.
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            || { echo "::error::launcher icons were not copied into the Android project"; exit 1; }
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
            || { echo "::error::adaptive launcher icon missing"; exit 1; }
          # Android's web view has no Notification API, so alerts in the app go
          # through this plugin. If it is not registered, the app installs with
          # its alerts quietly dead.
          grep -q 'LocalNotifications' android/app/src/main/assets/capacitor.plugins.json \
            || { echo "::error::local notifications plugin is not registered — alerts would not work in the app"; exit 1; }
          echo "::notice::Hockey.AI launcher icons in place; local notifications registered."

      - name: Build the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd android
          cat >> app/build.gradle <<EOF

          // Kotlin folded kotlin-stdlib-jdk7 and -jdk8 into kotlin-stdlib at
          // 1.8. Part of the Capacitor dependency graph still asks for those
          // split artifacts at 1.6.21 while everything else resolves the
          // stdlib at 1.8.22, so the release build saw every JDK7/8 class
          // twice and checkReleaseDuplicateClasses stopped it. Drop the
          // merged-away artifacts instead of pinning a Kotlin version: their
          // classes all live in the stdlib that is already on the classpath,
          // so nothing is lost and there is no version here to go stale.
          configurations.all {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
          }

          android {
              // Every APK the workflow has ever produced carried the template's
              // versionCode 1. Android only installs over an existing app when
              // the code strictly increases, so a stable signing key alone was
              // never going to make updates work — each new build looked like
              // the same version and would be refused. Take the number from the
              // run counter so it rises on its own and nothing is pinned here.
              defaultConfig {
                  versionCode $VERSION_CODE
                  versionName "$VERSION_NAME"
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_FILE"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias "hockeyai"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          # Dropping those artifacts is only safe while the stdlib actually
          # carries their classes, which it has since 1.8. Check that rather
          # than trust it: a stdlib older than 1.8 would build clean here and
          # crash on the phone with a missing class, which is the worst way to
          # find out. Resolve the real classpath and read the version off it.
          # KS_FILE has to be exported for EVERY gradle invocation, not just the
          # assemble: the signingConfigs block above reads it at configuration
          # time, so without it file(null) throws before any task can run —
          # which is exactly how the first attempt at this check died.
          export KS_FILE="$GITHUB_WORKSPACE/android.keystore"
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > /tmp/deps.txt 2>&1 || true
          STDLIB=$(grep -oE 'org\.jetbrains\.kotlin:kotlin-stdlib:[0-9]+\.[0-9]+\.[0-9]+( -> [0-9]+\.[0-9]+\.[0-9]+)?' /tmp/deps.txt \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$STDLIB" ]; then
            # Say why rather than just that it failed — a silent "unreadable"
            # is a dead end for whoever reads this next.
            echo "::error::could not read the resolved kotlin-stdlib version, so the JDK7/8 exclusion above cannot be shown to be safe. Gradle output follows."
            tail -40 /tmp/deps.txt
            exit 1
          fi
          MAJOR=${STDLIB%%.*}; REST=${STDLIB#*.}; MINOR=${REST%%.*}
          if [ "$MAJOR" -lt 2 ] && { [ "$MAJOR" -lt 1 ] || [ "$MINOR" -lt 8 ]; }; then
            echo "::error::kotlin-stdlib resolves to $STDLIB, which predates the 1.8 merge of kotlin-stdlib-jdk7/jdk8. Excluding those artifacts would drop classes the app needs at runtime."
            exit 1
          fi
          echo "::notice::kotlin-stdlib $STDLIB carries the JDK7/8 classes — the exclusion is safe."

          ./gradlew assembleRelease --no-daemon
          cd ..
          APK=$(find android -name '*-release.apk' ! -name '*unsigned*' | head -1)
          if [ -z "$APK" ]; then echo "::error::no signed APK produced"; exit 1; fi
          cp "$APK" HockeyAI.apk
          ls -la HockeyAI.apk

          # A green compile says nothing about what ended up inside. These are
          # the things whose absence would install cleanly and then show an
          # empty app on someone's phone, which is the one failure nobody can
          # diagnose from there.
          for f in assets/public/index.html assets/public/data/data-version.json; do
            unzip -l HockeyAI.apk | grep -q " $f\$" \
              || { echo "::error::the APK does not contain $f — it would install and open on nothing"; exit 1; }
          done
          echo "::notice::APK carries the interface and the data snapshot."

          # And prove the version actually rose, rather than trusting the
          # override above to have taken. A silent no-op here is invisible
          # until an install is refused months later.
          AAPT=$(find "$ANDROID_HOME/build-tools" -name 'aapt2' -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT" ]; then
            echo "::warning::aapt2 not found, so the APK's versionCode could not be read back."
          else
            GOT=$("$AAPT" dump badging HockeyAI.apk 2>/dev/null | grep -oE "versionCode='[0-9]+'" | grep -oE '[0-9]+' | head -1)
            if [ "$GOT" != "$VERSION_CODE" ]; then
              echo "::error::APK reports versionCode $GOT, expected $VERSION_CODE. Android refuses an update unless this rises, so the override did not take."
              exit 1
            fi
            echo "::notice::APK versionCode $GOT — installs will update in place once a stable key is set."
          fi

      # Every run leaves an installable APK attached to itself, so a branch
      # can be tested on a real phone before it is merged. This is the only
      # artifact a branch run produces — see the publish step below.
      - name: Attach the APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: HockeyAI-apk
          path: HockeyAI.apk
          if-no-files-found: error

      # The rolling release is what people download, so only main publishes to
      # it. A branch run still builds and proves the APK above; without this
      # gate, dispatching the workflow to test a branch would quietly replace
      # the public download with an unreviewed build.
      - name: Publish to rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes 2>/dev/null || true
          git push --delete origin apk-latest 2>/dev/null || true
          gh release create apk-latest HockeyAI.apk \
            --title "Hockey.AI for Android" \
            --notes "The Android build of Hockey.AI. Download HockeyAI.apk, allow installs from your browser when prompted, and open — it runs as its own app, with no address bar and no dependency on the website. Every match, table, rating and prediction is stored on the device and refreshes from the central data whenever there is a connection, so it keeps working in a stadium with no signal. Follow a team on its page and tap the bell on Home for start-of-match and full-time alerts while the app is open or in the background. IMPORTANT — if you already have an older Hockey.AI installed, uninstall it first: builds before this one were a wrapper around the website and are signed with a different key, so Android refuses to install over them, and the old one left in place is still the version showing a browser address bar."

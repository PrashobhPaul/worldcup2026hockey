name: Update Hockey Data

on:
  schedule:
    # Every 30 min during CET match hours, Aug 15-30
    - cron: '0,30 10-20 15-30 8 *'
    # Hourly fallback rest of day
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pdfplumber

      - name: Update fixtures, statuses & Oracle picks
        run: python scripts/update_data.py

      - name: Generate AI match stories
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_ai_stories.py

      - name: Commit & push if changed
        run: |
          git config user.name "hockey-ai-bot"
          git config user.email "actions@github.com"
          git add public/data/
          if ! git diff --staged --quiet; then
            git commit -m "data: auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No data changes."
          fi

name: Update Hockey Data

on:
  schedule:
    # Every 10 min through CET match hours (first push-backs are 09:30 CET =
    # 07:30 UTC; the old 10-20 UTC window missed the morning games entirely,
    # which is why match 29 sat scoreless for two hours). At 15-minute cadence
    # a goal could sit unseen for most of a quarter — NED v IND showed 1-0
    # while the real score was 3-1; ten minutes keeps the running score within
    # a few minutes of the pitch.
    - cron: '*/10 6-20 15-30 8 *'
    # Hourly fallback rest of day
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      probe_match_ids:
        description: 'Comma-separated TMS match ids to dump (debug only)'
        required: false
        default: ''
      probe_lineup_match:
        description: 'TMS match id to probe for official line-ups (debug only)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write  # chain the Pages deploy after a data push

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Full history: rankings_history.py recovers the world-ranking snapshot
      # that stood before each match from the commit log, and a shallow clone
      # collapses that series to a single entry.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pdfplumber

      # This job owns public/data/*.json, and it runs on main every ten
      # minutes, so any branch open longer than one cycle diverges from it.
      # .gitattributes already routes those files to scripts/merge_data.py,
      # which knows the pipeline owns played results while the branch owns the
      # schedule and the editorial fields — but a merge driver is per-clone git
      # config, and GitHub's servers never configure one. That is why the same
      # conflict, with the same correct answer, kept reappearing on every pull
      # request. Configuring it here and taking main first makes this the clone
      # that resolves it. On main the merge is already an ancestor, so this is
      # a no-op.
      - name: Take main's data before rebuilding it
        run: |
          git config merge.hockeydata.name "Hockey.AI data merge"
          git config merge.hockeydata.driver "python3 scripts/merge_data.py --driver %O %A %B %P"
          git config user.name "hockey-ai-bot"
          git config user.email "actions@github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Already contains main - nothing to merge."
          else
            git merge --no-edit origin/main
            # A merge produces content neither side published on its own, so
            # the stamp has to describe the result. The merge driver cannot do
            # it: git hands each handler temporary files and updates the
            # working tree only once every driver has returned, so nothing
            # inside the merge can hash the finished tree.
            python3 scripts/data_fingerprint.py --write
            if ! git diff --quiet public/data/data-version.json; then
              git commit -qam "data: restamp the fingerprint after merging main"
            fi
            # Deliberately not pushed here. main runs main's code, so its data
            # can be a schema behind this branch's — no official team sheets,
            # ratings without their components. Pushing at this point publishes
            # that intermediate state to the branch, and anything reading it in
            # the minute before the rebuild finishes sees the worse of the two
            # files. The merge commit rides out with the rebuilt data below.
          fi

      - name: Update fixtures, statuses & Oracle picks
        env:
          PROBE_MATCH_IDS: ${{ github.event.inputs.probe_match_ids }}
        run: python scripts/update_data.py

      - name: Crop uploaded emblem artwork (if present)
        run: python scripts/crop_emblem.py

      - name: Generate AI match stories
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_ai_stories.py

      # AI-authored pre-match rationales for upcoming picks; without a key the
      # deterministic rationale the pipeline writes stands (see ai_provider.py).
      - name: Generate AI pick rationales
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_ai_rationales.py

      # Written match briefs and pre-match rationales live in the review
      # scripts, which are the source of truth for that prose. Applying them
      # here means a brief reaches the published data through the pipeline
      # rather than only when someone runs the script by hand. Both are
      # idempotent — they write only when the wording actually differs.
      # The intros describe who is at this tournament, and the official team
      # list is what decides that. Idempotent — it writes only on a difference.
      - name: Correct the team intros against the official team list
        run: python scripts/team_intro_review.py

      - name: Apply written match briefs
        run: |
          python scripts/stage1_review.py
          python scripts/stage2_review.py

      # Fixtures still to be played carry a pick, so they carry a rationale,
      # and it is held to the same standard as one for a match already played:
      # argued from this tournament, never from a ranking gap. Idempotent.
      - name: Apply written rationales for the fixtures still to come
        run: python scripts/knockout_review.py

      # The pipeline rebuilds these files from its own sources every ten
      # minutes, which would quietly undo the corrections made against the
      # official FIH export — a wrong scoreline and eight reversed listings.
      # Re-applying here keeps the published record agreeing with the match
      # centre no matter how often the pipeline runs. It is idempotent.
      # The FIH entry list is the answer to "is this the squad, and is that
      # how the man spells his name" — for every nation, every shirt number,
      # every captaincy and goalkeeper mark. It ran inside the line-up probe,
      # which is dormant unless a match id is dispatched and sits after the
      # gates, so it had never once executed: a check nothing runs is not a
      # check. It runs every time now, before anything can fail, and writes its
      # findings to the run summary so they survive log truncation.
      #
      # Report only. A name this app has shown for a fortnight is not rewritten
      # by a report nobody has read, and the entry list is unreachable often
      # enough that a failure here must not stop the data update.
      - name: Check the published squads against the FIH entry list
        continue-on-error: true
        run: |
          {
            echo '## Squads vs the FIH entry list'
            echo '```'
            python scripts/verify_squads.py 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Reconcile against the official FIH record
        run: python scripts/apply_official_matchdata.py

      # The world-ranking table is live, so the replay needs the snapshot that
      # stood before each match rather than today's. Refresh the series first.
      - name: Refresh ranking history
        run: python scripts/rankings_history.py

      # Model calibration, replayed as-of-then over every completed match, so
      # the figure the app headlines is reproducible from the repository.
      - name: Publish model calibration
        run: python scripts/backtest_model.py --publish

      # Every step above may have written into public/data, and not all of
      # them stamp: update_data.py and apply_official_matchdata.py do,
      # rankings_history.py and backtest_model.py do not. Stamping once here,
      # after the last writer and before the commit, describes whatever the
      # job actually produced and does not depend on remembering to add a
      # stamp to the next script that joins the pipeline.
      - name: Stamp the data fingerprint
        run: python3 scripts/data_fingerprint.py --write

      - name: Commit & push if changed
        id: commit
        run: |
          git config user.name "hockey-ai-bot"
          git config user.email "actions@github.com"
          git add public/data/
          git add public/emblem.png 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "data: auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
          fi
          # Anything unpushed goes out together — the merge above as well as
          # the rebuild — so the branch never holds main's data without this
          # run's work on top of it.
          if [ "$(git rev-list --count @{u}..HEAD 2>/dev/null || echo 0)" -gt 0 ]; then
            # This job runs every ten minutes and the branch it pushes to is
            # worked on at the same time, so the ref moves under it. A bare
            # push simply loses that race and fails the run — which is what a
            # rejected push here has meant every time. Rebasing onto whatever
            # arrived and trying again resolves it: .gitattributes routes the
            # data files through scripts/merge_data.py, so the rebase applies
            # the same rules the merge would.
            pushed=false
            for attempt in 1 2 3 4; do
              if git push; then pushed=true; break; fi
              echo "push rejected (attempt $attempt) — taking what arrived and retrying."
              git pull --rebase --no-edit origin "${{ github.ref_name }}" || break
              python3 scripts/data_fingerprint.py --write
              git add public/data/
              git diff --staged --quiet || git commit -q --amend --no-edit
              sleep $((attempt * 3))
            done
            if [ "$pushed" != true ]; then
              echo "::error::could not push the data update after four attempts."
              exit 1
            fi
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No data changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # Every push here puts every open pull request one commit behind main,
      # and because these are whole-file rewrites of public/data/*.json that
      # is a conflict, not a fast-forward. The branch has no way to notice: a
      # push to main triggers nothing on a feature branch. So a review that
      # was conflict-free ten minutes ago is dirty by the time anyone opens
      # it, over and over, and somebody has to merge main by hand each time.
      #
      # This closes that loop. After a data push, every open pull request
      # targeting main gets this same workflow dispatched on its head branch,
      # where the first step configures the merge driver, merges main and
      # pushes. Forks are skipped — the token cannot write to them. Failures
      # are tolerated so a branch that cannot be updated never fails the data
      # run that main depends on.
      - name: Carry the update into open pull requests
        if: steps.commit.outputs.pushed == 'true' && github.ref_name == 'main'
        continue-on-error: true
        run: |
          branches=$(curl -sS \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open&base=main&per_page=100" \
            | python3 -c "import json,sys; print(' '.join(p['head']['ref'] for p in json.load(sys.stdin) if p['head']['repo'] and p['head']['repo']['full_name']=='${{ github.repository }}'))")
          if [ -z "$branches" ]; then echo "No open pull requests to update."; exit 0; fi
          for b in $branches; do
            echo "Dispatching the data pipeline on $b to take main."
            curl -sS -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-data.yml/dispatches" \
              -d "{\"ref\":\"$b\"}" || echo "  could not dispatch on $b"
          done

      # The same rule that makes the Pages dispatch below necessary — a
      # GITHUB_TOKEN push triggers no `on: push` workflow — means a data push
      # into a pull request's head branch leaves that pull request's own CI
      # unrun, and GitHub queues the pull_request run as awaiting approval. So
      # the branch is left reading "unstable" with an unrun check, which is
      # exactly what a reviewer should not have to interpret.
      #
      # The gates therefore run here, in the run that made the change, whenever
      # this pipeline is working on a branch rather than on main. main's own
      # data pushes are covered by CI on the merge that lands them.
      - name: Verify the data this run just wrote
        if: steps.commit.outputs.pushed == 'true' && github.ref_name != 'main'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Run the gates against the new data
        if: steps.commit.outputs.pushed == 'true' && github.ref_name != 'main'
        run: |
          npm ci
          npm run test:probability
          npm run test:bracket
          npm run test:tiers
          npm run test:accuracy
          npm run test:picks
          npm run test:playerstats
          npm run test:bestxi
          npm run test:rating
          npm run test:intros
          npm run test:sheets
          npm run test:stats
          npm run test:medalpath
          npm run test:impact
          npm run test:sim
          npm run test:fingerprint
          python3 scripts/test_story_facts.py

      # The gates above verify the data, but they do it inside this run — so a
      # pull request whose head this job just moved carries no check of its
      # own, and a reviewer opening it sees an unverified head. The same
      # GITHUB_TOKEN rule is the cause, and the same remedy applies as for the
      # Pages deploy below: dispatch the check explicitly. A dispatched CI run
      # attaches to the pull request the branch belongs to, so the head reads
      # as verified rather than as unchecked.
      - name: Post a visible check for the head this run pushed
        if: steps.commit.outputs.pushed == 'true' && github.ref_name != 'main'
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}" \
            || echo "  could not dispatch CI on ${{ github.ref_name }}."

      # GITHUB_TOKEN pushes never trigger `on: push` workflows, so the Pages
      # deploy must be dispatched explicitly or the live site serves stale data.
      - name: Redeploy GitHub Pages with fresh data
        if: steps.commit.outputs.pushed == 'true'
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Pages redeploy dispatched."

      # The official app shows full line-ups — starting eleven, substitutes with
      # the minute each came on, team staff — so the data exists and is served
      # to somebody. Our fetcher gets 403. This finds out why: it warms up a
      # session, reads the match page for how the tab is actually filled, and
      # asks for the line-up every way a browser might.
      #
      # It runs last on purpose. The logs API truncates a job from the end, and
      # this job prints tens of thousands of lines, so a probe placed anywhere
      # else has its answer cut off — which is exactly what happened the first
      # time. Dormant unless a match id is passed on dispatch.
      - name: Probe how the official line-ups are served
        if: github.event.inputs.probe_lineup_match != ''
        env:
          PROBE_LINEUP_MATCH: ${{ github.event.inputs.probe_lineup_match }}
        continue-on-error: true
        run: |
          python scripts/probe_lineups.py || true
          python scripts/probe_appapi.py || true
          python scripts/probe_reports.py || true
          python scripts/probe_sheets.py || true

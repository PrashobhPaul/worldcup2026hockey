name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guards the single-source-of-truth rule: every surface must read the
      # same canonical tournament probability snapshot, and snapshots must be
      # reproducible. A drift between Tournament, Oracle and Home fails here.
      - name: Data-pipeline parser tests
        run: python3 scripts/test_parsers.py

      - name: Tournament probability consistency
        run: npm run test:probability

      # The preview deck asserts numbers about real teams, so its honesty rules
      # are tested: no card without a real sample, and every claim scoped to
      # this tournament — we hold no all-time record and must never imply one.
      - name: Match preview evidence
        run: npm run test:preview

      # Published data must never change without the stamp changing with it:
      # an installed app that holds the old stamp would never refetch, and the
      # reader would sit on stale briefs with nothing wrong on the server.
      #
      # On pull requests this must check the PR HEAD, not GitHub's synthetic
      # test merge: the data cron advances main every half hour, and the test
      # merge mixes both sides' data files without restamping — a red that
      # says nothing about the branch. On push events the merge result itself
      # is checked, which is what caught the broken web-merge of PR #22.
      - name: Data fingerprint
        run: |
          REF="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          git fetch --depth=1 origin "$REF"
          git worktree add /tmp/fp-check "$REF"
          cd /tmp/fp-check && python3 scripts/data_fingerprint.py --check

      # Briefs must be true to the match record — every scorer named, every
      # goal minute cited — and a pick's rationale must argue from this
      # tournament rather than from a ranking gap or from hindsight.
      - name: Story and rationale facts
        run: python3 scripts/test_story_facts.py

      # An empty local database must never be mistaken for an up-to-date one:
      # that is what rendered a shell full of empty tabs with nothing to explain
      # it. scripts/smoke_recovery.mjs covers the same ground in a real browser.
      - name: Sync policy
        run: npm run test:sync

      # The Cup tab and the Oracle bracket must project one tournament, not
      # two: the pool table on screen IS the ordering the semi-final slots use.
      - name: Bracket projection
        run: npm run test:bracket

      # A match past push-back is live with an estimated quarter, and past its
      # window it is full-time awaiting the official score — never a Q1 that
      # lasts all day, never an invented 0-0, never a mid-match score frozen in.
      - name: Live clock honesty
        run: npm run test:clock

      # Every claim on the Match Intelligence panel — corner-goal counts,
      # ranking gaps, named set-piece scorers, the full-time state of the
      # win-probability chart — recomputed from the official event feed for
      # every completed match. One active Oracle pick per fixture, never two.
      - name: Match intelligence consistency
        run: npm run test:intel

      # Six of sixteen carry a tag, and the quota must not drift: three
      # favourites, two dark horses, one underdog, and never an eliminated team.
      - name: Team tier assignment
        run: npm run test:tiers

      # The published pick rule is a port of a model whose replay numbers are
      # known. Reproduce them from the author's reference table in both
      # modes, and hold every published pick to the configured one.
      - name: Non-knockout model port
        run: npm run test:model

      # One model, one published figure. The hero once read winner_named_pct
      # while Matches, Oracle and Trust read accuracy_pct — 78% beside 68%,
      # both true, measuring different things, with nothing saying which.
      - name: One published accuracy figure
        run: npm run test:accuracy

      # A pick, its distribution and its confidence are three statements of
      # one claim. A card once read "India to win" above ARG 70% with a 70%
      # ring — the pick, the numbers and the reason disagreeing on the page.
      - name: Picks agree with their own numbers
        run: npm run test:picks

      # Every player number the app prints, recomputed from the match feed.
      # A Top Assists board once ranked nine players on an assist apiece that
      # no event records and FIH does not publish for this competition.
      - name: Player stats match the feed
        run: npm run test:playerstats

      # The best XI is positional, and the pitch stands on the position data.
      # It also guards player identity: ids are the client store's primary key,
      # and thirteen players once shared one with a team-mate, which does not
      # look like a wrong number — it looks like a missing player.
      - name: Best XI is positional and players are uniquely identified
        run: npm run test:bestxi

      # The rating has to be readable: every number is the weighted sum of the
      # components printed beside it, each component is a percentile inside a
      # comparable position group, and a component the record cannot feed is
      # declared rather than scored zero.
      - name: The positional rating explains itself
        run: npm run test:rating

      # Every claim a team intro makes about who is at this tournament,
      # checked against the official FIH team list. Eleven of sixteen team
      # cards once named the wrong captain, and nine intros were built around
      # players who did not travel.
      - name: Team intros match the official team list
        run: npm run test:intros

      # The official team sheet is read from a two-column PDF where a name
      # can be one word or four, so the split between the two teams is the
      # thing most likely to go quietly wrong.
      - name: Official team sheets are read exactly
        run: npm run test:sheets

      # The FIH publishes its own individual statistics for this competition.
      # Every figure this app shows is derived instead, so the two are read
      # against each other rather than assumed to agree.
      - name: Player figures reconcile with the FIH's own statistics
        run: npm run test:stats

      # The medal path is derived from the record rather than drawn, so it is
      # checked against the label the FIH puts on the fixture itself.
      - name: The medal path matches the FIH's own slot labels
        run: npm run test:medalpath

      # Key players are named on the knockout pages and on every team page. A
      # card that hands each question to a different name looks right and reads
      # wrong, so the selection is asserted rather than eyeballed.
      - name: Key players are the players who actually carry a side
        run: npm run test:impact

      - name: Build
        run: npm run build

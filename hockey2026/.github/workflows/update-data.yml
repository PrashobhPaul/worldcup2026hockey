name: ⚡ Update Hockey Data

on:
  # Run every 30 minutes during tournament window (UTC: 11:00–19:00 = CET 13:00–21:00)
  schedule:
    - cron: '0,30 11-19 15-30 8 *'   # Aug 15–30, every 30 min during match hours
    - cron: '0 * 15-30 8 *'           # Every hour outside match window (keep fresh)

  # Manual trigger (for testing or immediate updates)
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even outside match window'
        required: false
        default: 'false'
        type: boolean

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Allow committing updated data files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pdfplumber requests --quiet

      - name: Update standings from FIH TMS
        run: |
          python scripts/update_data.py
        continue-on-error: true   # Don't fail the whole workflow if FIH is down

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Hockey.AI Bot 🏑"
          git add data/
          git commit -m "⚡ Auto-update: standings & fixtures [skip ci] — $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: No changes detected
        if: steps.changes.outputs.changed != 'true'
        run: echo "✓ Data unchanged — no commit needed"
